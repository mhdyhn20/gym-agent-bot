<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رخ فیت</title><style>:root{--bg:#0b0d0f;--card:#15181c;--line:#282d33;--text:#f5f2ea;--muted:#9ca3ab;--gold:#d9bd83;--green:#4ea99d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;padding:18px 16px 100px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:800}.muted{font-size:11px;color:var(--muted)}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:18px;margin:10px 0}.hero{background:linear-gradient(145deg,#183c38,#101619)}h1{font-size:27px;line-height:1.45}.badge{font-size:10px;color:var(--gold)}.primary,.secondary{min-height:45px;border-radius:14px;padding:0 15px}.primary{border:0;background:var(--gold);color:#17120a;font-weight:800}.secondary{background:#20252a;border:1px solid var(--line);color:var(--text)}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:13px;border-radius:17px;background:var(--card);border:1px solid var(--line)}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:13px;padding:8px 2px}.day.on{color:var(--gold);border-color:var(--gold)}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#111419f2;border-top:1px solid var(--line);display:flex;justify-content:center}.nav button{width:20%;max-width:130px;background:none;border:0;color:var(--muted);font-size:9px;padding:9px 2px 12px}.nav button.on{color:var(--gold)}.nav b{display:block;font-size:18px}.exercise{display:grid;grid-template-columns:35px 1fr 15px;align-items:center;gap:10px}.num{width:34px;height:34px;border-radius:11px;background:#22272d;display:grid;place-items:center;color:var(--gold)}.exercise h3{font-size:13px;margin:0 0 5px}.exercise p{font-size:9px;color:var(--muted);margin:0}.coach{background:#1b2d2b;border:1px solid #2b514b;border-radius:16px;padding:13px;margin:12px 0;font-size:10px;line-height:1.9}.field{margin:10px 0}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;height:44px;background:#0f1215;color:#fff;border:1px solid var(--line);border-radius:12px;padding:0 9px}.set{display:grid;grid-template-columns:28px 1fr 28px 1fr;gap:5px;align-items:center;margin:6px 0}.set input{width:100%;height:39px;background:#0f1215;border:1px solid var(--line);color:#fff;border-radius:10px;text-align:center}.analysis{padding:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:7px 0}.analysis small{display:block;color:var(--muted);font-size:9px;margin-top:4px}</style></head><body><div id="root"></div><script>const root=document.getElementById('root');const G=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const D=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];const P=[['بالاتنه',[['پرس سینه هالتر',3,8,12],['لت پول‌داون',3,8,12],['روئینگ دستگاه',3,10,12],['نشر جانب',3,12,15],['جلو بازو',2,10,12],['پشت بازو',2,10,12]]],['پا',[['پرس پا',3,8,12],['پشت پا',3,10,12],['جلو پا',2,10,15],['ساق پا',3,12,15],['پلانک',2,30,60]]],['بالاتنه',[['پرس سینه دستگاه',3,8,12],['لت پول‌داون',3,8,12],['روئینگ دستگاه',2,10,12],['نشر جانب',3,12,15],['هامر کرل',2,10,12],['پشت بازو طناب',3,10,12]]],['بالاتنه + بازو',[['پرس بالا سینه دستگاه',3,8,12],['لت پول‌داون',3,8,12],['پرس سینه دستگاه',2,10,12],['روئینگ دستگاه',2,10,12],['نشر جانب',3,12,15],['جلو بازو کابل',3,10,12],['پشت بازو طناب',3,10,12]]],['پا + سرشانه',[['پرس پا',3,8,12],['پشت پا',3,10,12],['جلو پا',2,10,15],['هیپ تراست',3,8,12],['ساق پا',3,12,15],['پرس سرشانه دستگاه',3,8,12],['نشر جانب',3,12,15]]],['استراحت',[]],['استراحت',[]]];const today=()=>new Date().toISOString().slice(0,10);const logs=()=>G('rf.logs',{});const all=()=>Object.values(logs()).filter(x=>x.status==='done');let st={page:'home',day:Math.min(7,(new Date().getDay()+2)),session:null,current:0};function vol(x){return Object.values(x?.exercises||{}).reduce((n,e)=>n+(e.sets||[]).reduce((a,z)=>a+(+z.w||0)*(+z.r||0),0),0)}function last(n){return all().sort((a,b)=>(b.at||0)-(a.at||0)).find(x=>x.exercises?.[n])?.exercises?.[n]}function nav(){return '<nav class="nav">'+[['home','⌂','امروز'],['program','▦','برنامه'],['analytics','◫','تحلیل'],['history','◷','سابقه'],['profile','●','پروفایل']].map(x=>'<button data-page="'+x[0]+'" class="'+(st.page===x[0]?'on':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</nav>'}function shell(x){root.innerHTML='<main class="app">'+x+'</main>'+nav();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{st.page=b.dataset.page;render()})}function home(){let p=P[st.day-1],w=all().filter(x=>Date.now()-(x.at||0)<6048e5).length;return '<div class="top"><div><div class="brand">رخ فیت</div><div class="muted">مربی شخصی آفلاین</div></div><button class="secondary" data-profile>پروفایل</button></div><section class="hero"><span class="badge">'+D[st.day-1]+'</span><h1>'+(p[0]==='استراحت'?'روز بازیابی':'تمرین امروز: '+p[0])+'</h1><p class="muted">'+(p[1].length?p[1].length+' حرکت · ثبت ست‌ها برای فعال‌شدن مربی هوشمند':'تمرکز روی بازیابی و آماده‌شدن')+'</p>'+(p[1].length?'<button class="primary full" data-start>شروع تمرین</button>':'<button class="secondary full" data-rest>ثبت روز استراحت</button>')+'</section><div class="days">'+P.map((x,i)=>'<button class="day '+(st.day===i+1?'on':'')+'" data-day="'+(i+1)+'">'+(i+1)+'<br>'+D[i][0]+'</button>').join('')+'</div><div class="grid"><div class="stat"><b>'+w+'</b><span>جلسه این هفته</span></div><div class="stat"><b>'+all().length+'</b><span>جلسه کامل</span></div><div class="stat"><b>'+Math.min(100,w*20)+'٪</b><span>هدف هفتگی</span></div></div>'}function program(){let p=P[st.day-1];return '<div class="top"><div><div class="brand">برنامه</div><div class="muted">'+D[st.day-1]+'</div></div></div>'+(p[1].length?p[1].map((x,i)=>'<div class="card exercise"><div class="num">'+(i+1)+'</div><div><h3>'+x[0]+'</h3><p>'+x[1]+' ست · '+x[2]+'–'+x[3]+' تکرار</p></div><span>›</span></div>').join(''):'<div class="card">امروز استراحت است.</div>')}function analytics(){let a=all().slice(0,10),v=a.reduce((n,x)=>n+vol(x),0),r=a.filter(x=>x.readiness),avg=r.length?Math.round(r.reduce((n,x)=>n+x.readiness,0)/r.length):0;let names={};a.forEach(x=>Object.entries(x.exercises||{}).forEach(([n,e])=>names[n]=e));return '<div class="brand">تحلیل هوشمند</div><p class="muted">فقط بر اساس داده‌های خودت</p><div class="grid"><div class="stat"><b>'+ (avg||'—')+'</b><span>آمادگی میانگین</span></div><div class="stat"><b>'+v+'</b><span>حجم ثبت‌شده</span></div><div class="stat"><b>'+a.length+'</b><span>جلسه</span></div></div><div class="coach"><b>مربی هوشمند</b><br>'+ (a.length<3?'چند جلسه با ثبت دقیق ست، وزنه و تکرار انجام بده تا پیشنهادها شخصی‌تر شوند.':avg&&avg<50?'در داده‌های اخیر آمادگی پایین‌تر بوده؛ شدت را کنترل‌شده نگه دار.':'ثبت منظم ادامه پیدا کند؛ پیشنهاد پیشرفت از عملکرد قبلی هر حرکت ساخته می‌شود.')+'</div>'+Object.entries(names).slice(0,8).map(([n,e])=>'<div class="analysis"><b>'+n+'</b><small>'+((e.sets||[]).map(z=>(z.w||0)+'kg × '+(z.r||0)).join(' · '))+'</small></div>').join('')}function history(){return '<div class="brand">سابقه</div><p class="muted">جلسه‌های کامل‌شده</p>'+all().slice(0,15).map(x=>'<div class="card row"><span>'+new Date(x.at).toLocaleDateString('fa-IR')+' · روز '+x.day+'</span><b>'+Math.round(vol(x))+'</b></div>').join('')||'<div class="card">هنوز جلسه‌ای ثبت نشده.</div>'}function profile(){let p=G('rf.profile',{name:'ورزشکار',goal:'قدرت و عضله‌سازی'});return '<div class="brand">پروفایل</div><div class="card"><div class="field"><label>نام</label><input id="pn" value="'+p.name+'"></div><div class="field"><label>هدف</label><input id="pg" value="'+p.goal+'"></div><button class="primary full" data-save-profile>ذخیره</button></div><div class="coach">مربی هوشمند این نسخه آفلاین است و داده‌ها روی خود دستگاه ذخیره می‌شوند.</div>'}function begin(){let e=+document.getElementById('en').value,s=+document.getElementById('sl').value,f=+document.getElementById('so').value;st.session={day:st.day,started:Date.now(),readiness:Math.round(e*.45+s*.25+f*.3),exercises:{}};st.current=0;open()}function readiness(){root.insertAdjacentHTML('beforeend','<div id="m" style="position:fixed;inset:0;background:#000b;display:grid;place-items:end;padding:12px;z-index:10"><div class="card" style="width:min(680px,100%)"><h2>آمادگی امروز</h2><div class="field"><label>انرژی</label><select id="en"><option value="35">کم</option><option value="65" selected>معمولی</option><option value="90">زیاد</option></select></div><div class="field"><label>خواب</label><select id="sl"><option value="35">کم</option><option value="70" selected>متوسط</option><option value="90">خوب</option></select></div><div class="field"><label>خستگی عضلانی</label><select id="so"><option value="90" selected>کم</option><option value="60">متوسط</option><option value="35">زیاد</option></select></div><button class="primary full" data-begin>شروع</button></div></div>');document.querySelector('[data-begin]').onclick=()=>{begin();document.getElementById('m').remove()}}function open(){let p=P[st.day-1],x=p[1][st.current],name=x[0],prev=st.session.exercises[name]?.sets||last(name)?.sets||[];let html='<div class="top"><button class="secondary" data-back>برگشت</button><span>'+(st.current+1)+' / '+p[1].length+'</span></div><div class="card"><span class="badge">هدف '+x[1]+' × '+x[2]+'–'+x[3]+'</span><h2>'+name+'</h2><div class="coach">'+(!last(name)?'اولین ثبت این حرکت است؛ ست‌ها را با اجرای کنترل‌شده وارد کن.':(prev.every(z=>+z.r>=x[3])?'پیشنهاد مربی: به سقف تکرار رسیدی؛ جلسه‌ی بعد یک افزایش کوچک را فقط در صورت حفظ فرم امتحان کن.':'ثبت قبلی: '+prev[prev.length-1].w+' کیلو × '+prev[prev.length-1].r+' تکرار. فعلاً همین بازه را تکرار کن.'))+'</div>'+Array.from({length:x[1]},(_,i)=>'<div class="set"><span>ست '+(i+1)+'</span><input data-w="'+i+'" value="'+(prev[i]?.w||'')+'" placeholder="وزنه"><span>×</span><input data-r="'+i+'" value="'+(prev[i]?.r||'')+'" placeholder="تکرار"></div>').join('')+'<button class="primary full" data-next>ذخیره و ادامه</button></div>';root.innerHTML='<main class="app">'+html+'</main>';document.querySelector('[data-back]').onclick=()=>{st.page='home';render()};document.querySelector('[data-next]').onclick=()=>{let sets=[];for(let i=0;i<x[1];i++)sets.push({w:document.querySelector('[data-w="'+i+'"]').value,r:document.querySelector('[data-r="'+i+'"]').value});st.session.exercises[name]={sets:sets};if(st.current<p[1].length-1){st.current++;open()}else finish()}}function finish(){let l=logs();l[today()]={status:'done',day:st.day,at:Date.now(),readiness:st.session.readiness,exercises:st.session.exercises};S('rf.logs',l);st.session=null;st.page='home';render()}function render(){if(st.page==='home')shell(home());else if(st.page==='program')shell(program());else if(st.page==='analytics')shell(analytics());else if(st.page==='history')shell(history());else shell(profile())}document.addEventListener('click',e=>{let d=e.target.closest('[data-day]');if(d){st.day=+d.dataset.day;render()}if(e.target.closest('[data-start]'))readiness();if(e.target.closest('[data-rest]')){let l=logs();l[today()]={status:'rest',day:st.day,at:Date.now()};S('rf.logs',l);render()}if(e.target.closest('[data-profile]')){st.page='profile';render()}if(e.target.closest('[data-save-profile]')){S('rf.profile',{name:document.getElementById('pn').value,goal:document.getElementById('pg').value});render()}});render();</script></body></html>
