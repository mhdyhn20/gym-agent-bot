.muscle-layout{display:block}.muscle-atlas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.atlas-view{position:relative;padding:11px 6px 7px;background:linear-gradient(180deg,#fff,#f4f7f5);border:1px solid #dfe7e3;border-radius:22px;text-align:center;overflow:hidden}.atlas-view>span{display:inline-flex;padding:3px 9px;background:#e8f2ef;color:#286c66;border-radius:99px;font-size:8px;font-weight:700}.atlas-view svg{display:block;width:100%;height:285px;margin-top:4px}.silhouette{fill:#d8dfdc;stroke:#aab6b2;stroke-width:1}.muscle{fill:#c9d2cf;stroke:#f4f7f5;stroke-width:.8;opacity:.7;transition:fill .2s,opacity .2s}.muscle.secondary-muscle{fill:#8ebdb6;opacity:.95}.muscle.primary-muscle{fill:#14776f;opacity:1;filter:drop-shadow(0 2px 4px rgba(20,119,111,.22))}.atlas-legend{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:6px;padding:8px;background:#fff;border:1px solid #e2e8e5;border-radius:15px}.atlas-legend i{width:10px;height:10px;border-radius:4px}.atlas-legend .p{background:#14776f}.atlas-legend .s{background:#8ebdb6}.atlas-legend span{font-size:9px;color:#60706c;margin-left:8px}.muscle-layout>div:last-child{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;padding:15px;background:#fff;border:1px solid #dfe7e3;border-radius:20px}.muscle-layout>div:last-child small{font-size:9px;color:#71817d}.muscle-layout>div:last-child h3,.muscle-layout>div:last-child p{font-size:12px;margin:0;color:#24423d}.muscle-layout>div:last-child h3{color:#126b66}@media(max-width:370px){.atlas-view svg{height:250px}.muscle-atlas{gap:7px}.atlas-view{padding-inline:3px}}

  }

  window.onunhandledrejection=function(e){showError(e&&e.reason?String(e.reason):'Promise error','','',0);};
})();

s":3,"repMin":10,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"leg_extension","sets":2,"repMin":10,"repMax":15,"restSec":60,"restIsDefault":true},{"exercise":"lunge","sets":2,"repMin":8,"repMax":10,"restSec":90,"restIsDefault":true,"perSide":true},{"exercise":"calf","sets":3,"repMin":12,"repMax":15,"restSec":60,"restIsDefault":true},{"exercise":"plank","sets":2,"repMin":0,"repMax":0,"restSec":60,"restIsDefault":true,"duration":true,"note":"۲ ست کنترل‌شده"}]},{"day":4,"titleFa":"بالاتنه + بازو","items":[{"exercise":"incline_chest_machine","sets":3,"repMin":8,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"lat_pulldown","sets":3,"repMin":8,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"chest_press_machine","sets":2,"repMin":10,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"machine_row","sets":2,"repMin":10,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"lateral_raise","sets":3,"repMin":12,"repMax":15,"restSec":60,"restIsDefault":true},{"exercise":"cable_curl","sets":3,"repMin":10,"repMax":12,"restSec":60,"restIsDefault":true},{"exercise":"triceps_pushdown_rope","sets":3,"repMin":10,"repMax":12,"restSec":60,"restIsDefault":true},{"exercise":"hammer_curl","sets":2,"repMin":10,"repMax":12,"restSec":60,"restIsDefault":true},{"exercise":"triceps_overhead_rope","sets":2,"repMin":10,"repMax":12,"restSec":60,"restIsDefault":true}]},{"day":5,"titleFa":"پا + سرشانه","items":[{"exercise":"leg_press","sets":3,"repMin":8,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"leg_curl","sets":3,"repMin":10,"repMax":12,"restSec":90,"restIsDefault":true},{"exercise":"leg_extension","sets":2,"repMin":10,"repMax":15,"restSec":60,"restIsDefault":true},{"exercise":"hip_thrust","sets":3,"repMin":8,"repMax":12,"restSec":90,"restIsDefault":true,"note":"دستگاه یا هالتر؛ تصویر مرجع: هالتر"},{"exercise":"calf","sets":3,"repMin":12,"repMax":15,"restSec":60,"restIsDefault":true},{"exercise":"shoulder_press_machine","sets":3,"repMin":8,"repMax":12,"restSec":90,"restIsDefault":true,"note":"نوع وسیله در برنامه مشخص نشده"},{"exercise":"lateral_raise","sets":3,"repMin":12,"repMax":15,"restSec":60,"restIsDefault":true},{"exercise":"face_pull","sets":2,"repMin":12,"repMax":15,"restSec":60,"restIsDefault":true}]},{"day":6,"titleFa":"استراحت","rest":true,"items":[]},{"day":7,"titleFa":"استراحت","rest":true,"items":[]}];const EXERCISES={"bench_barbell":{"key":"bench_barbell","nameFa":"پرس سینه هالتر","datasetId":"Barbell_Bench_Press_-_Medium_Grip","nameEn":"Barbell Bench Press - Medium Grip","equipment":"barbell","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"instructionsEn":["Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","From the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.","After a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"images":["images/bench_barbell-1.webp","images/bench_barbell-2.webp"],"variants":[]},"bench_dumbbell":{"key":"bench_dumbbell","nameFa":"پرس سینه دمبل","datasetId":"Dumbbell_Bench_Press","nameEn":"Dumbbell Bench Press","equipment":"dumbbell","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"instructionsEn":["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.","Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions of your training program."],"images":["images/bench_dumbbell-1.webp","images/bench_dumbbell-2.webp"],"variants":[]},"incline_db_press":{"key":"incline_db_press","nameFa":"بالا سینه دمبل","datasetId":"Incline_Dumbbell_Press","nameEn":"Incline Dumbbell Press","equipment":"dumbbell","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"instructionsEn":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."],"images":["images/incline_db_press-1.webp","images/incline_db_press-2.webp"],"variants":[]},"pec_fly_machine":{"key":"pec_fly_machine","nameFa":"فلای دستگاه","datasetId":"Butterfly","nameEn":"Butterfly","equipment":"machine","primaryMuscles":["chest"],"secondaryMuscles":[],"instructionsEn":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."],"images":["images/pec_fly_machine-1.webp","images/pec_fly_machine-2.webp"],"variants":[]},"shoulder_press_machine":{"key":"shoulder_press_machine","nameFa":"پرس سرشانه دستگاه","datasetId":"Machine_Shoulder_Military_Press","nameEn":"Machine Shoulder (Military) Press","equipment":"machine","primaryMuscles":["shoulders"],"secondaryMuscles":["triceps"],"instructionsEn":["Sit down on the Shoulder Press Machine and select the weight.","Grab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.","Now lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"images":["images/shoulder_press_machine-1.webp","images/shoulder_press_machine-2.webp"],"variants":[]},"lateral_raise":{"key":"lateral_raise","nameFa":"نشر جانب دمبل","datasetId":"Side_Lateral_Raise","nameEn":"Side Lateral Raise","equipment":"dumbbell","primaryMuscles":["shoulders"],"secondaryMuscles":[],"instructionsEn":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"images":["images/lateral_raise-1.webp","images/lateral_raise-2.webp"],"variants":[]},"triceps_pushdown_rope":{"key":"triceps_pushdown_rope","nameFa":"پشت بازو سیم‌کش طناب","datasetId":"Triceps_Pushdown_-_Rope_Attachment","nameEn":"Triceps Pushdown - Rope Attachment","equipment":"cable","primaryMuscles":["triceps"],"secondaryMuscles":[],"instructionsEn":["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"images":["images/triceps_pushdown_rope-1.webp","images/triceps_pushdown_rope-2.webp"],"variants":[]},"triceps_overhead_rope":{"key":"triceps_overhead_rope","nameFa":"پشت بازو بالای سر با طناب","datasetId":"Triceps_Overhead_Extension_with_Rope","nameEn":"Triceps Overhead Extension with Rope","equipment":"cable","primaryMuscles":["triceps"],"secondaryMuscles":[],"instructionsEn":["Attach a rope to a low pulley. After selecting an appropriate weight, grasp the rope with both hands and face away from the cable.","Position your hands behind your head with your elbows point straight up. Your elbows should start out flexed, and you can stagger your stance and lean gently away from the machine to create greater stability. This will be your starting position.","To perform the movement, extend through the elbow while keeping the upper arm in position, raising your hands above your head.","Squeeze your triceps at the top of the movement, and slowly lower the weight back to the start position."],"images":["images/triceps_overhead_rope-1.webp","images/triceps_overhead_rope-2.webp"],"variants":[]},"lat_pulldown":{"key":"lat_pulldown","nameFa":"لت‌پول‌داون","datasetId":"Wide-Grip_Lat_Pulldown","nameEn":"Wide-Grip Lat Pulldown","equipment":"cable","primaryMuscles":["lats"],"secondaryMuscles":["biceps","middle back","shoulders"],"instructionsEn":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"images":["images/lat_pulldown-1.webp","images/lat_pulldown-2.webp"],"variants":[]},"pullup":{"key":"pullup","nameFa":"بارفیکس / بارفیکس کمکی","datasetId":"Pullups","nameEn":"Pullups","equipment":"body only","primaryMuscles":["lats"],"secondaryMuscles":["biceps","middle back"],"instructionsEn":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"images":["images/pullup-1.webp","images/pullup-2.webp"],"variants":[{"labelFa":"بارفیکس کمکی (با کش)","datasetId":"Band_Assisted_Pull-Up","nameEn":"Band Assisted Pull-Up","equipment":"other","primaryMuscles":["lats"],"secondaryMuscles":["abdominals","forearms","middle back"],"instructionsEn":["Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.","Pull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.","Pull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.","After a brief pause, return to the starting position."],"images":["images/pullup-1.webp","images/pullup-2.webp"]}]},"cable_row":{"key":"cable_row","nameFa":"قایقی سیم‌کش","datasetId":"Seated_Cable_Rows","nameEn":"Seated Cable Rows","equipment":"cable","primaryMuscles":["middle back"],"secondaryMuscles":["biceps","lats","shoulders"],"instructionsEn":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"images":["images/cable_row-1.webp","images/cable_row-2.webp"],"variants":[]},"one_arm_row":{"key":"one_arm_row","nameFa":"زیربغل دمبل تک‌دست","datasetId":"One-Arm_Dumbbell_Row","nameEn":"One-Arm Dumbbell Row","equipment":"dumbbell","primaryMuscles":["middle back"],"secondaryMuscles":["biceps","lats","shoulders"],"instructionsEn":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."],"images":["images/one_arm_row-1.webp","images/one_arm_row-2.webp"],"variants":[]},"face_pull":{"key":"face_pull","nameFa":"فیس‌پول","datasetId":"Face_Pull","nameEn":"Face Pull","equipment":"cable","primaryMuscles":["shoulders"],"secondaryMuscles":["middle back"],"instructionsEn":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"images":["images/face_pull-1.webp","images/face_pull-2.webp"],"variants":[]},"barbell_curl":{"key":"barbell_curl","nameFa":"جلو بازو هالتر","datasetId":"Barbell_Curl","nameEn":"Barbell Curl","equipment":"barbell","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"instructionsEn":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"images":["images/barbell_curl-1.webp","images/barbell_curl-2.webp"],"variants":[]},"incline_db_curl":{"key":"incline_db_curl","nameFa":"جلو بازو دمبل روی میز شیب‌دار","datasetId":"Incline_Dumbbell_Curl","nameEn":"Incline Dumbbell Curl","equipment":"dumbbell","primaryMuscles":["biceps"],"secondaryMuscles":[],"instructionsEn":["Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"images":["images/incline_db_curl-1.webp","images/incline_db_curl-2.webp"],"variants":[]},"hammer_curl":{"key":"hammer_curl","nameFa":"جلو بازو چکشی","datasetId":"Hammer_Curls","nameEn":"Hammer Curls","equipment":"dumbbell","primaryMuscles":["biceps"],"secondaryMuscles":[],"instructionsEn":["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.","After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.","Repeat for the recommended amount of repetitions."],"images":["images/hammer_curl-1.webp","images/hammer_curl-2.webp"],"variants":[]},"squat":{"key":"squat","nameFa":"اسکوات","datasetId":"Barbell_Squat","nameEn":"Barbell Squat","equipment":"barbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings","lower back"],"instructionsEn":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"images":["images/squat-1.webp","images/squat-2.webp"],"variants":[]},"leg_press":{"key":"leg_press","nameFa":"پرس پا","datasetId":"Leg_Press","nameEn":"Leg Press","equipment":"machine","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings"],"instructionsEn":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"images":["images/leg_press-1.webp","images/leg_press-2.webp"],"variants":[]},"leg_curl":{"key":"leg_curl","nameFa":"پشت پا دستگاه","datasetId":"Seated_Leg_Curl","nameEn":"Seated Leg Curl","equipment":"machine","primaryMuscles":["hamstrings"],"secondaryMuscles":[],"instructionsEn":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"images":["images/leg_curl-1.webp","images/leg_curl-2.webp"],"variants":[{"labelFa":"خوابیده","datasetId":"Lying_Leg_Curls","nameEn":"Lying Leg Curls","equipment":"machine","primaryMuscles":["hamstrings"],"secondaryMuscles":[],"instructionsEn":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"images":["images/leg_curl-1.webp","images/leg_curl-2.webp"]}]},"leg_extension":{"key":"leg_extension","nameFa":"جلو پا دستگاه","datasetId":"Leg_Extensions","nameEn":"Leg Extensions","equipment":"machine","primaryMuscles":["quadriceps"],"secondaryMuscles":[],"instructionsEn":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."],"images":["images/leg_extension-1.webp","images/leg_extension-2.webp"],"variants":[]},"lunge":{"key":"lunge","nameFa":"لانج دمبل","datasetId":"Dumbbell_Lunges","nameEn":"Dumbbell Lunges","equipment":"dumbbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings"],"instructionsEn":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"images":["images/lunge-1.webp","images/lunge-2.webp"],"variants":[]},"calf":{"key":"calf","nameFa":"ساق پا دستگاه","datasetId":"Standing_Calf_Raises","nameEn":"Standing Calf Raises","equipment":"machine","primaryMuscles":["calves"],"secondaryMuscles":[],"instructionsEn":["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"images":["images/calf-1.webp","images/calf-2.webp"],"variants":[{"labelFa":"نشسته","datasetId":"Seated_Calf_Raise","nameEn":"Seated Calf Raise","equipment":"machine","primaryMuscles":["calves"],"secondaryMuscles":[],"instructionsEn":["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.","Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.","Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.","Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.","Raise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.","Repeat for the recommended amount of repetitions."],"images":["images/calf-1.webp","images/calf-2.webp"]}]},"plank":{"key":"plank","nameFa":"پلانک","datasetId":"Plank","nameEn":"Plank","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"instructionsEn":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],"images":["images/plank-1.webp","images/plank-2.webp"],"variants":[]},"incline_chest_machine":{"key":"incline_chest_machine","nameFa":"پرس بالا سینه دستگاه","datasetId":"Leverage_Incline_Chest_Press","nameEn":"Leverage Incline Chest Press","equipment":"machine","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"instructionsEn":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"images":["images/incline_chest_machine-1.webp","images/incline_chest_machine-2.webp"],"variants":[]},"chest_press_machine":{"key":"chest_press_machine","nameFa":"پرس سینه دستگاه","datasetId":"Leverage_Chest_Press","nameEn":"Leverage Chest Press","equipment":"machine","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"instructionsEn":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"images":["images/chest_press_machine-1.webp","images/chest_press_machine-2.webp"],"variants":[]},"machine_row":{"key":"machine_row","nameFa":"قایقی دستگاه","datasetId":"Leverage_Iso_Row","nameEn":"Leverage Iso Row","equipment":"machine","primaryMuscles":["lats"],"secondaryMuscles":["biceps","middle back"],"instructionsEn":["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"images":["images/machine_row-1.webp","images/machine_row-2.webp"],"variants":[{"labelFa":"نسخه‌ی بالا (High Row)","datasetId":"Leverage_High_Row","nameEn":"Leverage High Row","equipment":"machine","primaryMuscles":["middle back"],"secondaryMuscles":["lats"],"instructionsEn":["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"images":["images/machine_row-1.webp","images/machine_row-2.webp"]}]},"cable_curl":{"key":"cable_curl","nameFa":"جلو بازو سیم‌کش","datasetId":"Standing_Biceps_Cable_Curl","nameEn":"Standing Biceps Cable Curl","equipment":"cable","primaryMuscles":["biceps"],"secondaryMuscles":[],"instructionsEn":["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"images":["images/cable_curl-1.webp","images/cable_curl-2.webp"],"variants":[]},"hip_thrust":{"key":"hip_thrust","nameFa":"هیپ تراست","datasetId":"Barbell_Hip_Thrust","nameEn":"Barbell Hip Thrust","equipment":"barbell","primaryMuscles":["glutes"],"secondaryMuscles":["calves","hamstrings"],"instructionsEn":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by d function programPage(){state.page='program';shell(`<header class="page-head"><span class="kicker">برنامه‌ی هفتگی</span><h1>روزهای تمرین</h1><p>یک روز را انتخاب کنید و حرکات را به‌ترتیب ببینید.</p></header><div class="day-list">${PROGRAM.map(d=>`<button class="day-card" data-open-day="${d.day}"><div class="day-num">${fa(d.day)}</div><div><small>${dayName(d.day)}</small><h2>${d.titleFa}</h2><p>${d.rest?'بازیابی و کشش سبک':`${fa(d.items.length)} حرکت · ${[...new Set(d.items.map(i=>mf[EXERCISES[i.exercise].primaryMuscles[0]]))].slice(0,3).join('، ')}`}</p></div><span>‹</span></button>`).join('')}</div>`);$$('[data-open-day]').forEach(b=>b.onclick=()=>dayDetail(+b.dataset.openDay))}
function dayDetail(n){state.day=n;let d=PROGRAM.find(x=>x.day===n);app.innerHTML=`<main class="vapp sub"><header class="subhead"><button class="back" data-back>${icon('back')}</button><div><span class="kicker">${dayName(n)}</span><h1>${d.titleFa}</h1></div></header>${d.rest?`<section class="today-card">${recovery()}</section>`:`<section class="day-summary"><b>${fa(d.items.length)}</b><span>حرکت به‌ترتیب برنامه</span><button class="primary" data-start>شروع تمرین</button></section><div class="exercise-list">${d.items.map((it,i)=>exerciseCard(it,i,n)).join('')}</div>`}</main>${nav()}${resumeBar()}`;bindNav();$('[data-back]').onclick=()=>route('program');if($('[data-start]'))$('[data-start]').onclick=()=>readiness(n);$$('[data-ex]').forEach(b=>b.onclick=()=>openExercise(b.dataset.ex,+b.dataset.i,n,'learn'))}
function exerciseCard(it,i,n){let e=EXERCISES[it.exercise];return `<button class="ex-card" data-ex="${e.key}" data-i="${i}"><div class="order">${fa(i+1)}</div><img src="${e.images[0]}" decoding="async"><div><h3>${e.nameFa}</h3><p>${itemText(it)} · استراحت ${restText(it)}</p><span>${mf[e.primaryMuscles[0]]}</span></div><i>‹</i></button>`}
function readiness(day){modal(`<div class="sheet-icon">${icon('clock')}</div><h2>آمادگی امروز</h2><p>برای تنظیم پیشنهادهای جلسه، سطح انرژی خود را انتخاب کنید.</p><div class="energy"><button data-energy="low">کم</button><button data-energy="normal">معمولی</button><button data-energy="high">زیاد</button></div><button class="secondary" data-cancel>انصراف</button>`);$$('[data-energy]').forEach(b=>b.onclick=()=>startSession(day,b.dataset.energy));$('[data-cancel]').onclick=closeModal}
function startSession(day,energy){let d=PROGRAM.find(x=>x.day===day),s={day,done:[],started:Date.now(),energy,current:0};set('gym.session',s);closeModal();toast(energy==='low'?'امروز شدت را کنترل کنید و استراحت بیشتری داشته باشید.':'جلسه آماده است؛ با فرم صحیح شروع کنید.');openExercise(d.items[0].exercise,0,day,'workout')}
function openSession(){let s=session(),d=PROGRAM.find(x=>x.day===s.day),i=Math.min(s.current||0,d.items.length-1);openExercise(d.items[i].exercise,i,s.day,'workout')}
function openExercise(key,i,day,mode){stopAuto();state.exercise=key;state.day=day;state.mode=mode;state.slide=0;let e=EXERCISES[key],it=((PROGRAM.find(x=>x.day===day) || {items:[]}).items[i])||PROGRAM.reduce(function(a,x){return a.concat(x.items||[])},[]).find(function(x){return x.exercise===key}),c=CONTENT[key];app.innerHTML=`<main class="exercise-page"><section class="media"><img src="${e.images[0]}" class="im a"><img src="${e.images[1]}" class="im b" style="opacity:0"><div class="shade"></div><button class="back media-back" data-back>${icon('back')}</button><button class="zoom" data-zoom>⛶</button><div class="phase"><span class="phase-step active">۱ شروع</span><span class="phase-step">۲ اجرا</span><span class="phase-step">۳ پایان</span></div><div class="motion"><button data-auto>${icon('play')}</button><input type="range" min="0" max="100" value="0"><button data-speed>۱×</button></div></section><section class="exercise-info"><div class="crumb">${dayName(day)} ← ${(PROGRAM.find(x=>x.day===day) || {titleFa:''}).titleFa||''}</div><h1>${e.nameFa}</h1><p class="eng">${e.nameEn}</p><div class="rx"><span>${itemText(it)}</span><span>استراحت ${restText(it)}</span><span>${eq[e.equipment]||e.equipment}</span></div>${mode==='workout'?workoutFocus(i,day):learnTabs(c,e)}</section></main>${mode==='workout'?workoutDock(i,day):''}`;bindExercise(e,c,i,day,mode)}
function learnTabs(c,e){return `<div class="tabs2">${[['run','اجرا'],['range','دامنه'],['setup','تنظیم'],['muscles','عضلات']].map(x=>`<button data-tab="${x[0]}" class="${state.tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="learn-panel">${learnPanel(c,e)}</div>`}
function learnPanel(c,e){if(state.tab==='run')return `<ol class="step-list">${c.stepsFa.map((x,i)=>`<li><b>${fa(i+1)}</b><p>${x}</p></li>`).join('')}</ol>`;if(state.tab==='range')return `<div class="info-block"><h3>نقطه‌ی شروع</h3><p>${c.start}</p><h3>نقطه‌ی پایان</h3><p>${c.end}</p><h3>مسیر حرکت</h3><p>${c.path}</p><aside><b>اشتباهات رایج</b><p>${c.errors}</p></aside></div>`;if(state.tab==='setup')return `<div class="info-block">${c.setup.map((x,i)=>`<h3>${['وضعیت بدن','وسیله و تنظیم','گریپ، پا و تنه'][i]}</h3><p>${x}</p>`).join('')}</div>`;return `<div class="muscle-layout">${muscleMap(e)}<div><small>عضله‌ی اصلی</small><h3>${c.primary.map(x=>x.fa).join('، ')}</h3><small>عضلات کمکی</small><p>${c.secondary.map(x=>x.fa).join('، ')||'—'}</p></div></div>`}
function workoutFocus(i,day){let s=session(),d=PROGRAM.find(x=>x.day===day);return `<div class="work-focus"><div class="progress-line"><i style="width:${(((s && s.done ? s.done.length : 0))/d.items.length)*100}%"></i></div><div><span>حرکت ${fa(i+1)} از ${fa(d.items.length)}</span><strong>${fa((s && s.done ? s.done.length : 0))} انجام‌شده</strong></div><p>فرم حرکت را کنترل کنید. پس از پایان ست‌های برنامه، حرکت را کامل کنید.</p><button class="link" data-learn>مشاهده‌ی آموزش کامل</button></div>`}
function workoutDock(i,day){return `<div class="work-dock"><button data-prev aria-label="قبلی">‹</button><button class="complete" data-complete>${icon('check')} حرکت انجام شد</button><button data-next aria-label="بعدی">›</button></div>`}
function bindExercise(e,c,i,day,mode){$('[data-back]').onclick=()=>mode==='workout'?todayPage():dayDetail(day);let range=$('.motion input');range.oninput=()=>setSlide(+range.value/100);$('[data-auto]').onclick=autoPlay;$('[data-speed]').onclick=b=>{state.speed=state.speed===1 ? .5 : 1;b.currentTarget.textContent=state.speed===1?'۱×':'۰٫۵×'};$('[data-zoom]').onclick=()=>lightbox(state.slide>.5?e.images[1]:e.images[0]);if(mode==='learn'){$$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;openExercise(e.key,i,day,'learn')})}else{$('[data-learn]').onclick=()=>openExercise(e.key,i,day,'learn');$('[data-prev]').onclick=()=>moveSession(i-1,day);$('[data-next]').onclick=()=>moveSession(i+1,day);$('[data-complete]').onclick=()=>completeMove(i,day)}}
function setSlide(v){state.slide=Math.max(0,Math.min(1,v));let a=$('.media .a'),b=$('.media .b'),r=$('.motion input');if(a){a.style.opacity=1-state.slide;b.style.opacity=state.slide;r.value=state.slide*100}let steps=$$('.phase-step');if(steps.length===3){let idx=state.slide<.34?0:(state.slide<.67?1:2);steps.forEach(function(x,i){x.classList.toggle('active',i===idx)})}}
function autoPlay(){if(state.play){stopAuto();return}let dir=1;state.play=setInterval(()=>{state.slide+=dir*(state.speed===1 ? .025 : .0125);if(state.slide>=1){state.slide=1;dir=-1}else if(state.slide<=0){state.slide=0;dir=1}setSlide(state.slide)},50)}
function stopAuto(){clearInterval(state.play);state.play=null}
function moveSession(i,day){let d=PROGRAM.find(x=>x.day===day);if(i<0||i>=d.items.length)return;let s=session();s.current=i;set('gym.session',s);openExercise(d.items[i].exercise,i,day,'workout')}
function completeMove(i,day){let s=session(),d=PROGRAM.find(x=>x.day===day),key=d.items[i].exercise;if(!s.done.includes(key))s.done.push(key);s.current=Math.min(i+1,d.items.length-1);set('gym.session',s);if(s.done.length===d.items.length)finishSession(s,d);else{startRest(d.items[i].restSec);moveSession(i+1,day)}}
function startRest(sec){let n=typeof sec==='number'?sec:+String(sec).split('-').pop();state.timerLeft=n;timerPanel();clearInterval(state.timer);state.timer=setInterval(()=>{state.timerLeft--;updateTimer();if(state.timerLeft<=0){clearInterval(state.timer);if(navigator.vibrate)navigator.vibrate([160,80,160]);toast('زمان استراحت تمام شد')}},1000)}
function timerPanel(){document.body.insertAdjacentHTML('beforeend',`<div class="timer-float"><button data-tclose>×</button><div class="ring"><b data-time>${fa(state.timerLeft)}</b><small>ثانیه</small></div><div><button data-plus>+۱۵</button><button data-skip>رد کردن</button></div></div>`);$('[data-plus]').onclick=()=>{state.timerLeft+=15;updateTimer()};$('[data-skip]').onclick=stopTimer;$('[data-tclose]').onclick=()=>$('.timer-float').classList.add('mini')}
function updateTimer(){let x=$('[data-time]');if(x)x.textContent=fa(Math.max(0,state.timerLeft))}

function editDate(k){let L=logs(),cur=(L[k] && L[k].status)||'';modal(`<h2>وضعیت روز</h2><p>${fa(k)}</p><div class="status-options">${[['done','انجام شد'],['partial','ناقص'],['skipped','رد شد'],['rest','استراحت']].map(x=>`<button data-stat="${x[0]}" class="${cur===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><button class="danger" data-delete>حذف ثبت</button><button class="secondary" data-cancel>بستن</button>`);$$('[data-stat]').forEach(b=>b.onclick=()=>{L[k]={status:b.dataset.stat,at:new Date(k).getTime()};set('gym.logs',L);closeModal();calendarPage()});$('[data-delete]').onclick=()=>{delete L[k];set('gym.logs',L);closeModal();calendarPage()};$('[data-cancel]').onclick=closeModal}
function profilePage(){state.page='profile';let p=profile(),a=values(logs()),done=a.filter(x=>x.status==='done').length,w=a.filter(x=>x.status==='done'&&Date.now()-x.at<604800000).length;shell(`<header class="profile-hero"><div class="big-avatar">${(p.name||'و')[0]}</div><div><span class="kicker">پروفایل شخصی</span><h1>${p.name||'ورزشکار'}</h1><p>${p.goal||'عضله‌سازی'}</p></div></header><div class="profile-stats"><div><b>${fa(done)}</b><small>جلسه کامل</small></div><div><b>${fa(w)}</b><small>این هفته</small></div><div><b>${fa(Math.min(100,w*20))}٪</b><small>هدف</small></div></div><section class="form-card"><label>نام</label><input id="pname" value="${p.name||''}"><label>هدف تمرینی</label><select id="pgoal">${['عضله‌سازی','افزایش قدرت','تناسب اندام','سلامت عمومی'].map(x=>`<option ${p.goal===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" data-save>ذخیره تغییرات</button></section><section class="coach-card"><span class="kicker">مربی آفلاین</span><h3>${w>=5?'هدف هفتگی کامل شد':w>=3?'روندت خوب و پایدار است':'روی استمرار تمرکز کن'}</h3><p>${w>=5?'جلسه‌ی اضافه لازم نیست؛ ریکاوری باکیفیت بخشی از پیشرفت است.':w>=3?'فرم صحیح را حفظ کن و کیفیت را فدای سرعت نکن.':'یک جلسه‌ی کوتاه و کامل، بهتر از تمرینی سنگین و رهاشده است.'}</p></section>`);$('[data-save]').onclick=()=>{set('gym.profile',{name:$('#pname').value.trim()||'ورزشکار',goal:$('#pgoal').value});toast('پروفایل ذخیره شد');profilePage()}}

function lightbox(src){modal(`<button class="lb-close" data-cancel>×</button><img class="lb-img" src="${src}"><p>برای بستن، دکمه‌ی × را لمس کنید.</p>`);$('[data-cancel]').onclick=closeModal}
// خانه‌ی لندینگ‌محور؛ اقدام اصلی، وضعیت هفته و مسیر سریع را در یک نمای جذاب جمع می‌کند.
function todayPage(){state.page='today';let d=PROGRAM.find(x=>x.day===state.day),l=logs()[keyDate()],p=profile(),s=session(),isToday=state.day===dayNumber(),heroEx=d.items && d.items[0]?EXERCISES[d.items[0].exercise]:EXERCISES.warmup_bike;let muscles=d.rest?[]:[...new Set(d.items.map(i=>mf[EXERCISES[i.exercise].primaryMuscles[0]]))].slice(0,4);shell(`<header class="landing-nav"><div class="brand"><i></i><div><b>Rokh Fitness</b><small>${persianDate()}</small></div></div><button class="avatar" data-go-profile>${(p.name||'و')[0]}</button></header><section class="landing-hero ${d.rest?'is-rest':''}"><img src="${heroEx.images[0]}" decoding="async" alt="${heroEx.nameFa}"><div class="landing-overlay"></div><div class="hero-copy"><span class="hero-badge">${isToday?'برنامه‌ی امروز':dayName(state.day)} · ${statusLabel((l && l.status))}</span><p class="hello">${greeting()}، ${p.name||'ورزشکار'}</p><h1>${d.rest?'امروز برای قوی‌تر شدن، بازیابی کن':d.titleFa}</h1><p>${d.rest?'یک روز آرام برای کشش سبک، خواب بهتر و آماده‌شدن برای جلسه‌ی بعد.':`${fa(d.items.length)} حرکت هدفمند · حدود ${fa(55+d.items.length*3)} دقیقه`}</p>${d.rest?'<button class="hero-cta" data-rest>ثبت روز استراحت</button>':`<button class="hero-cta" data-start>${(s && s.day)===d.day?'ادامه‌ی جلسه':'شروع تمرین'} ${icon('play')}</button>`}</div></section><section class="landing-week"><div class="section-row"><div><span class="kicker">مسیر هفتگی</span><h2>برنامه‌ی این هفته</h2></div><button data-all-days>همه‌ی روزها</button></div>${weekStrip()}</section>${s&&!s.finished?`<button class="active-session" data-resume><div class="pulse"></div><div><b>جلسه‌ی فعال</b><span>${dayName(s.day)} · ${fa(s.done.length)} از ${fa(PROGRAM.find(x=>x.day===s.day).items.length)} حرکت</span></div><strong>ادامه ‹</strong></button>`:''}<section class="landing-insights"><div class="section-row"><div><span class="kicker">عملکرد شما</span><h2>در یک نگاه</h2></div><button data-calendar>تقویم</button></div><div class="insight-grid">${landingStats()}</div></section><section class="next-card"><div><span class="kicker">پیشنهاد مربی آفلاین</span><h3>${coachHeadline()}</h3><p>${coachCopy()}</p></div><div class="coach-orb">${icon('check')}</div></section>${d.rest?`<section class="recovery-card">${recovery()}</section>`:`<section class="today-preview"><div class="section-row"><div><span class="kicker">جلسه‌ی انتخاب‌شده</span><h2>حرکت‌های اول</h2></div><button data-day-detail>مشاهده همه</button></div>${d.items.slice(0,3).map((it,i)=>exerciseCard(it,i,d.day)).join('')}</section>`}`);$('.avatar').onclick=()=>route('profile');$$('[data-pick-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.pickDay;todayPage()});$('[data-all-days]').onclick=()=>route('program');$('[data-calendar]').onclick=()=>route('calendar');if($('[data-start]'))$('[data-start]').onclick=()=>(s && s.day)===d.day?openSession():readiness(d.day);if($('[data-resume]'))$('[data-resume]').onclick=openSession;if($('[data-day-detail]'))$('[data-day-detail]').onclick=()=>dayDetail(d.day);$$('[data-ex]').forEach(b=>b.onclick=()=>openExercise(b.dataset.ex,+b.dataset.i,d.day,'learn'));if($('[data-rest]'))$('[data-rest]').onclick=()=>{let L=logs();L[keyDate()]={status:'rest',day:d.day,at:Date.now()};set('gym.logs',L);toast('روز استراحت ثبت شد');todayPage()}}
function greeting(){let h=new Date().getHours();return h<12?'صبح بخیر':h<18?'وقت بخیر':'شب بخیر'}
function landingStats(){let a=values(logs()),done=a.filter(x=>x.status==='done'),week=done.filter(x=>Date.now()-x.at<604800000).length,mins=done.reduce((n,x)=>n+(x.duration||0),0);return `<article class="insight main"><span>هدف هفتگی</span><b>${fa(Math.min(100,week*20))}٪</b><div><i style="width:${Math.min(100,week*20)}%"></i></div><small>${fa(week)} از ۵ جلسه</small></article><article class="insight"><span>جلسه کامل</span><b>${fa(done.length)}</b><small>از شروع برنامه</small></article><article class="insight"><span>زمان تمرین</span><b>${fa(mins)}</b><small>دقیقه ثبت‌شده</small></article>`}
function coachHeadline(){let a=values(logs()).filter(x=>x.status==='done'&&Date.now()-x.at<604800000).length;return a>=5?'این هفته را قدرتمند تمام کردی':a>=3?'ریتم خوبی ساخته‌ای':'قدم بعدی را امروز بردار'}
function coachCopy(){let a=values(logs()).filter(x=>x.status==='done'&&Date.now()-x.at<604800000).length;return a>=5?'تمرین اضافه لازم نیست؛ ریکاوری باکیفیت بخشی از پیشرفت است.':a>=3?'کیفیت اجرا را حفظ کن و بین ست‌ها به‌اندازه کافی استراحت داشته باش.':'یک جلسه‌ی کنترل‌شده و کامل، بهتر از تمرینی سنگین و نیمه‌کاره است.'}
// صفحات داخلی با همان زبان بصری لندینگ.
function programPage(){state.page='program';let done=values(logs()).filter(x=>x.status==='done').length;shell(`<header class="inner-hero program-hero"><div><span class="inner-badge">برنامه‌ی شخصی شما</span><h1>هر روز، یک قدم<br>به نسخه‌ی قوی‌تر</h1><p>پنج جلسه‌ی هدفمند با ترتیب مشخص و آموزش تصویری کامل.</p></div><div class="hero-metric"><b>${fa(done)}</b><span>جلسه کامل</span></div></header><div class="section-row inner-title"><div><span class="kicker">تقسیم‌بندی هفتگی</span><h2>روزهای برنامه</h2></div><span class="subtle">۵ تمرین · ۲ استراحت</span></div><div class="premium-day-list">${PROGRAM.map(d=>{let ex=d.items && d.items[0]?EXERCISES[d.items[0].exercise]:EXERCISES.warmup_bike;return `<button class="premium-day ${d.rest?'rest':''}" data-open-day="${d.day}"><img src="${ex.images[0]}" decoding="async"><div class="premium-shade"></div><div class="premium-content"><span>${dayName(d.day)} · روز ${fa(d.day)}</span><h2>${d.titleFa}</h2><p>${d.rest?'ریکاوری، کشش سبک و آماده‌سازی':`${fa(d.items.length)} حرکت · حدود ${fa(55+d.items.length*3)} دقیقه`}</p><div>${d.rest?'<i>بازیابی</i>':[...new Set(d.items.map(i=>mf[EXERCISES[i.exercise].primaryMuscles[0]]))].slice(0,3).map(x=>`<i>${x}</i>`).join('')}</div></div><strong>‹</strong></button>`}).join('')}</div>`);$$('[data-open-day]').forEach(b=>b.onclick=()=>dayDetail(+b.dataset.openDay))}
function dayDetail(n){state.day=n;let d=PROGRAM.find(x=>x.day===n),ex=d.items && d.items[0]?EXERCISES[d.items[0].exercise]:EXERCISES.warmup_bike;app.innerHTML=`<main class="vapp sub"><header class="day-hero"><img src="${ex.images[0]}" decoding="async"><div></div><button class="back light-back" data-back>${icon('back')}</button><section><span>${dayName(n)} · روز ${fa(n)}</span><h1>${d.titleFa}</h1><p>${d.rest?'روز بازیابی فعال':`${fa(d.items.length)} حرکت به‌ترتیب برنامه · حدود ${fa(55+d.items.length*3)} دقیقه`}</p></section></header>${d.rest?`<section class="recovery-card">${recovery()}</section>`:`<div class="day-action"><div><b>${fa(d.items.length)}</b><span>حرکت هدفمند</span></div><button class="primary" data-start>${(session() && session().day===n)?'ادامه‌ی جلسه':'شروع تمرین'} ${icon('play')}</button></div><div class="section-row inner-title"><div><span class="kicker">مسیر جلسه</span><h2>حرکت‌ها به‌ترتیب</h2></div></div><div class="exercise-list premium-exercises">${d.items.map((it,i)=>exerciseCard(it,i,n)).join('')}</div>`}</main>${nav()}${resumeBar()}`;bindNav();$('[data-back]').onclick=()=>route('program');if($('[data-start]'))$('[data-start]').onclick=()=>(session() && session().day===n)?openSession():readiness(n);$$('[data-ex]').forEach(b=>b.onclick=()=>openExercise(b.dataset.ex,+b.dataset.i,n,'learn'))}
function calendarPage(){state.page='calendar';let L=logs(),now=new Date(),cells=[],done=values(L).filter(x=>x.status==='done'),week=done.filter(x=>Date.now()-x.at<604800000).length;for(let i=34;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);let k=keyDate(d),st=(L[k] && L[k].status)||'';cells.push(`<button class="cal-cell ${st}" data-date="${k}"><small>${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'short'}).format(d)}</small><b>${fa(new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric'}).format(d))}</b><i></i></button>`)}shell(`<header class="inner-hero calendar-hero"><div><span class="inner-badge">تقویم پیشرفت</span><h1>استمرار تو،<br>داستان پیشرفت توست</h1><p>روی هر روز بزنید تا وضعیت آن را ببینید یا ویرایش کنید.</p></div><div class="hero-metric"><b>${fa(week)}</b><span>این هفته</span></div></header><section class="calendar-summary"><div><span>جلسات کامل</span><b>${fa(done.length)}</b></div><div><span>هدف هفتگی</span><b>${fa(Math.min(100,week*20))}٪</b></div><div class="summary-progress"><i style="width:${Math.min(100,week*20)}%"></i></div></section><div class="section-row inner-title"><div><span class="kicker">۳۵ روز اخیر</span><h2>فعالیت روزانه</h2></div></div><div class="legend"><span class="done">کامل</span><span class="partial">ناقص</span><span class="skipped">ردشده</span><span class="rest">استراحت</span></div><section class="cal-grid premium-calendar">${cells.join('')}</section>`);$$('[data-date]').forEach(b=>b.onclick=()=>editDate(b.dataset.date))}
function profilePage(){state.page='profile';let p=profile(),a=values(logs()),done=a.filter(x=>x.status==='done').length,w=a.filter(x=>x.status==='done'&&Date.now()-x.at<604800000).length;shell(`<header class="profile-cover"><div class="cover-pattern"></div><div class="profile-identity"><div class="big-avatar">${(p.name||'و')[0]}</div><div><span>پروفایل شخصی</span><h1>${p.name||'ورزشکار'}</h1><p>${p.goal||'عضله‌سازی'}</p></div></div><div class="profile-level"><i style="width:${Math.min(100,w*20)}%"></i></div><small>${fa(w)} از ۵ جلسه‌ی هدف این هفته</small></header><div class="profile-stats premium-stats"><div><b>${fa(done)}</b><small>جلسه کامل</small></div><div><b>${fa(w)}</b><small>این هفته</small></div><div><b>${fa(Math.min(100,w*20))}٪</b><small>هدف</small></div></div><section class="coach-card premium-coach"><div class="coach-orb">${icon('check')}</div><div><span class="kicker">مربی آفلاین</span><h3>${w>=5?'هدف هفتگی کامل شد':w>=3?'ریتم خوبی ساخته‌ای':'شروع کوچک، نتیجه‌ی بزرگ'}</h3><p>${w>=5?'برای پیشرفت پایدار، امروز روی ریکاوری تمرکز کن.':w>=3?'کیفیت اجرا را حفظ کن و عجله نداشته باش.':'جلسه‌ی بعد را کوتاه، کنترل‌شده و کامل انجام بده.'}</p></div></section><div class="section-row inner-title"><div><span class="kicker">تنظیمات شخصی</span><h2>اطلاعات پروفایل</h2></div></div><section class="form-card premium-form"><label>نام نمایشی</label><input id="pname" value="${p.name||''}" placeholder="نام شما"><label>هدف تمرینی</label><select id="pgoal">${['عضله‌سازی','افزایش قدرت','تناسب اندام','سلامت عمومی'].map(x=>`<option ${p.goal===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" data-save>ذخیره تغییرات</button></section>`);$('[data-save]').onclick=()=>{set('gym.profile',{name:$('#pname').value.trim()||'ورزشکار',goal:$('#pgoal').value});toast('پروفایل ذخیره شد');profilePage()}}
const app=document.getElementById('app');todayPage();
</script></body></html>
